name: stillform-local
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: stillform
      MYSQL_USER: stillform
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u stillform -D stillform -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
  wordpress:
    image: wordpress:7.1.0-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8097:80"
    environment: &wp_env
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: stillform
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      WORDPRESS_DB_NAME: stillform
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      - wordpress:/var/www/html
      - ./stillform:/var/www/html/wp-content/themes/stillform:ro
  cli:
    image: wordpress:cli-2-php8.3
    profiles: [tools]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment: *wp_env
    volumes:
      - wordpress:/var/www/html
      - ./stillform:/var/www/html/wp-content/themes/stillform:ro
      - ./:/workspace:ro
volumes:
  database:
  wordpress:
